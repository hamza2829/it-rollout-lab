---
- name: Configure Windows workstation (simulated host, lint and syntax check only)
  hosts: windows_workstations
  gather_facts: false
  vars:
    win_local_users:
      - name: labadmin
        groups: [Administrators]
      - name: operator01
        groups: [Users]
  tasks:
    - name: Ensure local lab groups exist
      ansible.windows.win_group:
        name: "{{ item }}"
        state: present
      loop: [LabOperators, LabQA]

    - name: Ensure local users exist
      ansible.windows.win_user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        password_never_expires: false
        state: present
      loop: "{{ win_local_users }}"
      no_log: true

    - name: Install security updates
      ansible.windows.win_updates:
        category_names: [SecurityUpdates, CriticalUpdates]
        reboot: false
      register: win_updates_result

    - name: Enable Windows firewall for all profiles
      ansible.windows.win_firewall:
        state: enabled
        profiles: [Domain, Private, Public]

    - name: Disable SMBv1
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: SMB1
        data: 0
        type: dword

    - name: Ensure monitoring agent service is running
      ansible.windows.win_service:
        name: lab-monitoring-agent
        start_mode: auto
        state: started
